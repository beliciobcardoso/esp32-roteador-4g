; Configuracao local da maquina, fora do git: porta serial, e o que mais for de uma
; placa/maquina so. O padrao versionado fica abaixo; o override, se existir, ganha.
; Nao e obrigatorio — o glob do extra_configs ignora o arquivo ausente sem reclamar.
[platformio]
extra_configs = platformio_override.ini
; Env padrao do projeto. Sem esta chave o default do PlatformIO e o PRIMEIRO env do
; arquivo (native), e `pio project init --ide vscode` gera um c_cpp_properties.json
; apontando pro gcc do host, sem Arduino.h nem esp_*.h — o IntelliSense do VSCode
; reclamava de todo include de hardware. `pio test -e native` continua explicito.
default_envs = esp-wrover-kit

; Testes das regras puras, rodando no host — sem placa, sem serial, sem flash.
; Escopo deliberadamente pequeno: so o que nao toca hardware. Testar infra/ exigiria
; mock de ESP-IDF e nao se paga aqui (debito 19).
;
; build_src_filter restringe a compilacao a src/domain: o resto do src/ inclui
; Arduino.h/esp_*.h e nao existe no host. E o filtro que mantem a fronteira honesta —
; se algum dia domain/ passar a incluir hardware, quebra aqui antes de quebrar o conceito.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<domain/>
build_flags = -std=gnu++17 -Wall -Wextra -I src

[env:esp-wrover-kit]
platform = espressif32
board = esp-wrover-kit
framework = espidf, arduino

monitor_speed = 115200

; Recusa o build quando o sdkconfig.esp-wrover-kit gerado nao tem o que o
; sdkconfig.defaults pede. O gerado so e recriado quando falta, entao opcao nova no
; defaults nao chegava ao firmware e o build saia verde assim mesmo (debito 26).
extra_scripts = pre:scripts/check_sdkconfig.py

; Tabela de particoes propria (4MB, dois slots de OTA). Precisa estar aqui e nao so
; no sdkconfig.defaults: o PlatformIO sobrescreve CONFIG_PARTITION_TABLE_* com o
; default do board na hora de gerar o sdkconfig, entao a chave do sdkconfig sozinha
; era ignorada e o build continuava com o factory de 1MB.
board_build.partitions = partitions.csv
; Caminho by-id em vez de /dev/ttyACMx: o numero do ACM muda conforme a ordem de
; enumeracao USB. Ja apontou pra uma porta inexistente, o upload falhou e a placa
; seguiu rodando o firmware antigo — com o log parecendo so mais uma falha do modem.
; O by-id amarra no serial do adaptador e nao muda entre replugues.
;
; O 58EF052375 e o serial de UM adaptador. Outra maquina ou outro adaptador nao edita
; este arquivo: cria um platformio_override.ini (ignorado pelo git) com
;
;   [env:esp-wrover-kit]
;   upload_port = /dev/serial/by-id/<o seu>
;   monitor_port = /dev/serial/by-id/<o seu>
;
; A variavel de ambiente PLATFORMIO_UPLOAD_PORT tambem funciona, mas so metade do
; caminho: monitor_port nao tem sysenvvar no PlatformIO 6.2 — conferido na tabela de
; opcoes e na pratica, o monitor ignora PLATFORMIO_MONITOR_PORT e continua no valor
; daqui. Por isso o override em arquivo, que cobre os dois (debito 20).
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_58EF052375-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_58EF052375-if00

; A pagina de configuracao (http/index.html) entra no binario via EMBED_TXTFILES, que
; esta declarado em src/CMakeLists.txt. Esta chave nao e redundante: o CMake so poe o
; index.html.S na lista de fontes do componente, quem de fato gera esse .S no build dir
; e o SCons do PlatformIO, e ele so faz isso com o arquivo listado aqui. Sem esta linha o
; build morre em "Source `.pio/build/<env>/index.html.S' not found".
board_build.embed_txtfiles = http/index.html

; esp_modem (Fase 4) usa std::string_view/std::from_chars — exige C++17.
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

; Board real e LilyGO T-A7670E R2 (ESP32-WROVER-E, 4MB flash, 8MB PSRAM QSPI).
; esp-wrover-kit e o board mais proximo disponivel no PlatformIO;
; ajustes finos de flash/PSRAM ficam no sdkconfig.defaults.
