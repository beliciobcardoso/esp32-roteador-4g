[env:esp-wrover-kit]
platform = espressif32
board = esp-wrover-kit
framework = espidf, arduino

monitor_speed = 115200

; Tabela de particoes propria (4MB, dois slots de OTA). Precisa estar aqui e nao so
; no sdkconfig.defaults: o PlatformIO sobrescreve CONFIG_PARTITION_TABLE_* com o
; default do board na hora de gerar o sdkconfig, entao a chave do sdkconfig sozinha
; era ignorada e o build continuava com o factory de 1MB.
board_build.partitions = partitions.csv
; Caminho by-id em vez de /dev/ttyACMx: o numero do ACM muda conforme a ordem de
; enumeracao USB. Ja apontou pra uma porta inexistente, o upload falhou e a placa
; seguiu rodando o firmware antigo — com o log parecendo so mais uma falha do modem.
; O by-id amarra no serial do adaptador e nao muda entre replugues.
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_58EF052375-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_58EF052375-if00

; esp_modem (Fase 4) usa std::string_view/std::from_chars — exige C++17.
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

; Board real e LilyGO T-A7670E R2 (ESP32-WROVER-E, 4MB flash, 8MB PSRAM QSPI).
; esp-wrover-kit e o board mais proximo disponivel no PlatformIO;
; ajustes finos de flash/PSRAM ficam no sdkconfig.defaults.
